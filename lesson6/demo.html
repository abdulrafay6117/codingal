<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>forms in html </title>
</head>
<body>
    <h1>forms in html</h1>

    <form>
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" required>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required>

        <label for="password">Password:</label>
        <input type="password" id="password" name="password" required>

        <label for="gender">gender</label>
        <input type="radio" name="gender" value="male">male
        <input type="radio" name="gender" value="female">female

        <label for="favcars">favcars:</label>
        <select name="favcars" name="favcars">
            <option value="audi">audi</option>
            <option value="bmw">bmw</option>
            <option value="mercedes">mercedes</option>

            <label for="Date of Birth">DOB:</label>
            <input type="date" name="dob">

            <label for="favcolor">favcolor:</label> 
            <input type="checkbox" value="red"> name"red"
            <input type="checkbox" value="blue"> name"blue"
            <input type="checkbox" value="green"> name"green"

            <input type="button" value="submit">
</body>
</html>
